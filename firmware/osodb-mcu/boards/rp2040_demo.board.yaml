# OSOlogic MCU board profile — hand this to "the bear" and it adapts to the hardware.
# boardgen.py turns it into board_map.c (tag<->pin bindings + control loops) that calls
# only hal.h. Port to any MCU/SoC (STM32, RP2040, ESP32, Rockchip M-cores, …) by writing
# one of these — or have the LLM generate it from the datasheet/pinout.
#
# (C) 2026 Roig Borrell S.L. and Ibercomp S.L. — AGPL-3.0-or-later

board: rp2040_demo
soc: RP2040
rtos: zephyr            # zephyr | freertos | host   (host = the desktop simulator)

federation:
  transport: uart       # uart | mqtt | can
  baud: 115200

# Physical I/O -> osodb tags. dir: in|out. kind: gpio|adc|pwm.
io:
  - { tag: machine.run, dir: out, kind: gpio, pin: 25, type: bool }               # onboard LED as demo actuator
  - { tag: estop,       dir: in,  kind: gpio, pin: 14, type: bool, active_low: true }
  - { tag: temp,        dir: in,  kind: adc,  channel: 0, type: real, raw_max: 4095, out_min: -40.0, out_max: 125.0 }
  - { tag: heater,      dir: out, kind: pwm,  pin: 16, type: real, out_min: 0.0, out_max: 100.0 }

# Hard-real-time control loops, run every scan on the MCU. pv/cv must be io tags;
# sp is an internal set-point tag the hub writes (SET temp.sp 75). Gains are tunable
# at runtime (seed for the AI-improved-PID roadmap).
control:
  - { loop: temp_ctrl, pv: temp, sp: temp.sp, cv: heater, kp: 2.0, ki: 0.8, kd: 0.05, out_min: 0.0, out_max: 100.0 }
