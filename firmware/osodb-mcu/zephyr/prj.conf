# Base Zephyr config for the OSOlogic MCU tier. Federation runs over the console UART
# by default (portable, works everywhere); enable networking + MQTT per board/overlay.
# (C) 2026 Roig Borrell S.L. and Ibercomp S.L. — AGPL-3.0-or-later
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y     # %f/%g for tag values
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_FPU=y
